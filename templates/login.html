<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>

        body{
            margin:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#0f172a;
            font-family:Arial,sans-serif;
        }

        .login-box{
            width:350px;
            background:#1e293b;
            padding:30px;
            border-radius:12px;
            color:white;
            box-shadow:0 0 15px rgba(0,0,0,0.4);
        }

        h1{
            text-align:center;
            margin-bottom:25px;
        }

        input{
            width:100%;
            padding:12px;
            margin-bottom:15px;
            border:none;
            border-radius:6px;
            outline:none;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:6px;
            background:#3b82f6;
            color:white;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#2563eb;
        }

        .bottom-text{
            margin-top:18px;
            text-align:center;
            font-size:14px;
        }

        .bottom-text a{
            color:#60a5fa;
            text-decoration:none;
        }

        .error{
            color:red;
            text-align:center;
            margin-bottom:10px;
        }

    </style>
</head>
<body>

    <div class="login-box">

        <h1>Login 🔐</h1>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <input type="text" name="username" placeholder="Enter username" required>

            <input type="password" name="password" placeholder="Enter password" required>

            <button type="submit">Login</button>

        </form>

        <div class="bottom-text">
            Don’t have an account?
            <a href="register">Create Account</a>

             <p>
        <a href="/forgot-password/">Forgot Password?</a>
    </p>
        </div>

    </div>

</body>
</html>
