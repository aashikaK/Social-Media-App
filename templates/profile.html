<!DOCTYPE html>
<html>
<head>
    <title>Profile</title>

    <style>

        body{
            background:#0f172a;
            color:white;
            font-family:Arial;
        }

        .container{
            width:70%;
            margin:auto;
            margin-top:40px;
        }

        .box{
            background:#1e293b;
            padding:20px;
            border-radius:12px;
            margin-bottom:20px;
        }

        .post{
            background:#334155;
            padding:15px;
            margin-top:10px;
            border-radius:10px;
        }
        a{
            color:white;
            text-decoration:none;
        }
        h1{
            color:#60a5fa;
        }

    </style>
</head>
<body>

<div class="container">

    <div class="box">
        <a href="{% url "edit_profile" %}">✏️ Edit Profile</a>

        <h1>@{{ profile_user.username }}</h1>
        <p>Full Name: {{ profile.full_name }}</p>

    <p>Date of Birth: {{ profile.dob }}</p>

    <p>Email: {{ profile.user.email }}</p>

        <p>Profile Page</p>

    </div>

    <div class="box">

        <h2>Posts</h2>

        {% for post in posts %}

            <div class="post">
                <p>{{ post.content }}</p>
                <small>{{ post.created_at }}</small>
            </div>

        {% empty %}
            <p>No posts yet.</p>
        {% endfor %}

    </div>

</div>

</body>
</html>
